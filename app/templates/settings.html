{% extends "base.html" %}{% block content %}
<h1>Categorie e criteri</h1><section class="card"><h2>Nuova categoria</h2><form method="post" action="/settings/categories" class="inline-form"><input name="icon" value="⭐"><input name="name" placeholder="Nome" required><input type="number" step="1" name="weight" value="10"><input type="number" name="sort_order" value="99"><button>Aggiungi</button></form></section>
{% for cat in cats %}<section class="card"><form method="post" action="/settings/categories/{{ cat.id }}" class="inline-form"><input name="icon" value="{{ cat.icon }}"><input name="name" value="{{ cat.name }}"><input type="number" step="1" name="weight" value="{{ cat.weight }}"><input type="number" name="sort_order" value="{{ cat.sort_order }}"><label class="check"><input type="checkbox" name="active" {% if cat.active %}checked{% endif %}> attiva</label><button>Salva</button></form><h3>Criteri</h3>{% for crit in cat.criteria %}<form method="post" action="/settings/criteria/{{ crit.id }}" class="inline-form small"><input name="name" value="{{ crit.name }}"><input type="number" name="sort_order" value="{{ crit.sort_order }}"><label class="check"><input type="checkbox" name="active" {% if crit.active %}checked{% endif %}> attivo</label><button>Salva</button></form>{% endfor %}<form method="post" action="/settings/categories/{{ cat.id }}/criteria" class="inline-form small"><input name="name" placeholder="Nuovo criterio"><input type="number" name="sort_order" value="99"><button>Aggiungi criterio</button></form></section>{% endfor %}
{% endblock %}
