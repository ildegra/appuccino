{% extends "base.html" %}{% block content %}
<h1>Nuova visita · {{ bar.name }}</h1><form method="post" action="/bars/{{ bar.id }}/visit" class="card stack"><label>Data<input type="date" name="visited_at" value="{{ today }}" required></label><input name="drink" placeholder="Bevanda, es. cappuccino"><input name="food" placeholder="Cibo, es. brioche crema"><input type="number" step="0.01" name="total_price" placeholder="Prezzo totale"><input type="number" name="wait_minutes" placeholder="Attesa in minuti"><select name="crowd"><option value="">Affollamento</option><option>vuoto</option><option>poco affollato</option><option>normale</option><option>pieno</option><option>troppo pieno</option></select><textarea name="notes" placeholder="Note"></textarea><button>Continua ai voti</button></form>
{% endblock %}
