{% extends "base.html" %}
{% block page_title %}<h1>Modifica bar</h1>{% endblock %}
{% block content %}
<section class="panel form-panel">
  <div class="panel-head"><h2>{{ bar.name }}</h2><p class="muted">Correggi nome, indirizzo, comune o note.</p></div>
  <form method="post" action="/bars/{{ bar.id }}/edit" class="stack">
    <label>Nome del bar<input name="name" value="{{ bar.name }}" required></label>
    <label>Indirizzo<input name="address" value="{{ bar.address or '' }}"></label>
    <label>Comune<input name="city" value="{{ bar.city or '' }}"></label>
    <textarea name="notes" placeholder="Note generali">{{ bar.notes or '' }}</textarea>
    <div class="actions"><button>Salva modifiche</button><a class="button secondary" href="/bars/{{ bar.id }}">Annulla</a></div>
  </form>
</section>
{% endblock %}
